version: '3.8'

secrets:
  db_password:
    external: true
  rabbitmq_password:
    external: true
  rabbitmq_config:
    external: true
  app_password:
    external: true

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: monitoramento-rabbitmq
    networks:
      - 2nnet
    secrets:
      - source: rabbitmq_config
        target: /etc/rabbitmq/rabbitmq.conf
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  web:
    image: ghcr.io/2nprogramador/monitoramento-ativo-de-dados:1.0.18
    container_name: monitoramento-web
    networks:
      - 2nnet
    secrets:
      - db_password
      - rabbitmq_password
      - app_password
    environment:
      - APP_USER=admin
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=projeto
      - DB_USER=postgres
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin_monitoramento
      - RABBITMQ_PASSWORD_FILE=/run/secrets/rabbitmq_password
      - APP_PASSWORD_FILE=/run/secrets/app_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
      labels:
        - traefik.enable=true
        - traefik.http.routers.monitoramento.rule=Host(`projetodados.2nprogramacao.com.br`)
        - traefik.http.services.monitoramento.loadbalancer.server.port=8000
        - traefik.http.routers.monitoramento.service=monitoramento
        - traefik.http.routers.monitoramento.tls.certresolver=letsencryptresolver
        - traefik.http.routers.monitoramento.entrypoints=websecure
        - traefik.http.routers.monitoramento.tls=true

  worker:
    image: ghcr.io/2nprogramador/monitoramento-ativo-de-dados:1.0.18
    container_name: monitoramento-worker
    command: python backend/worker.py
    networks:
      - 2nnet
    secrets:
      - db_password
      - rabbitmq_password
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin_monitoramento
      - RABBITMQ_PASSWORD_FILE=/run/secrets/rabbitmq_password
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

volumes:
  rabbitmq_data:

networks:
  2nnet:
    name: 2nnet
    external: true
